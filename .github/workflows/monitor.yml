name: Monitor

# Cek kesehatan terjadwal: self-test algoritma di runtime tgcloud + koneksi DB.
# Bila gagal, workflow merah → GitHub mengirim notifikasi. Hanya jalan dari default branch.
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Health check
        run: |
          [ -n "$TGCLOUD_TOKEN" ] || { echo "::error::TGCLOUD_TOKEN kosong"; exit 1; }
          npx tgcloud run endpoints/health '{}' --ctx '{ initData: { user: { id: 1 } } }' | tee health.out
          grep -Eq '"?ok"?[: ]+true' health.out || { echo "::error::Health check gagal"; exit 1; }
