name: CI/CD

# Test di setiap push & PR. Deploy ke tgcloud otomatis HANYA dari main
# (atau manual lewat "Run workflow"). Butuh secret repo: TGCLOUD_TOKEN.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tes (logika, alur bot, audit, struktur)
        run: npm test

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Satu deploy pada satu waktu; jangan batalkan deploy yang sedang jalan.
    concurrency:
      group: tgcloud-deploy
      cancel-in-progress: false
    env:
      TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Pastikan secret TGCLOUD_TOKEN ada
        run: |
          if [ -z "$TGCLOUD_TOKEN" ]; then
            echo "::error::Secret TGCLOUD_TOKEN belum diisi (Settings → Secrets and variables → Actions)."
            exit 1
          fi

      # Runner selalu mulai tanpa snapshot lokal (.tgcloud/ di-gitignore), sehingga
      # `push` menolak menimpa bot yang sudah berisi modul. `fetch` mencatat revisi
      # cloud terbaru → pengecekan konflik tetap berlaku, tanpa --force.
      - name: Sinkronkan revisi cloud
        run: npx tgcloud fetch

      - name: Perubahan yang akan dideploy
        run: npx tgcloud status

      # Bug @tgcloud/cli 0.2.0: setelah upload sukses, CLI bisa crash saat menulis snapshot
      # lokal (ERR_INVALID_ARG_TYPE; server mengirim isi modul `false`). Kode SUDAH
      # terdeploy pada kasus itu → lanjut dengan peringatan; keberhasilan deploy
      # diverifikasi ketat oleh smoke test (versi di platform harus sama dengan repo).
      - name: Push kode
        run: |
          set +e
          npx tgcloud push 2>&1 | tee push.out
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            if grep -q "ERR_INVALID_ARG_TYPE" push.out && grep -q "✓" push.out; then
              echo "::warning::CLI crash saat menulis snapshot lokal setelah upload; deploy diverifikasi oleh smoke test."
            else
              exit "$code"
            fi
          fi

      # --safe: hanya perubahan aditif (tabel/kolom/indeks baru) diterapkan otomatis.
      # Drop, tipe kolom, dll. sengaja dilewati → jalankan `tgcloud migrate` manual.
      - name: Migrasi database (hanya yang aman)
        run: npx tgcloud migrate --safe

      - name: Smoke test di platform (self-test + koneksi DB)
        run: |
          npx tgcloud run endpoints/health '{}' --ctx '{ initData: { user: { id: 1 } } }' | tee health.out
          grep -Eq '"?ok"?[: ]+true' health.out || { echo "::error::Health check gagal setelah deploy"; exit 1; }
          want=$(node -p "require('./package.json').version")
          grep -Eq "\"?version\"?[: ]+['\"]?$want" health.out || { echo "::error::Versi di platform bukan $want — deploy tidak masuk"; exit 1; }
